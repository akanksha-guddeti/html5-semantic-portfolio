<body>

  <header class="site-header">
    <a class="logo" href="index.html" aria-label="Akanksha Guddeti home">AG.</a>
    <nav aria-label="Main navigation">
      <ul class="nav-list">

  <main id="main-content" class="page-content">
    <header class="page-heading">
      <p class="eyebrow">Let's connect</p>
      <h1>Contact Me</h1>
      <p>Have a project idea or collaboration opportunity? Get in touch.</p>
    </header>

    <section class="contact-panel" aria-labelledby="form-title">
      <h2 id="form-title">Send a message</h2>
      <p id="form-help">Fields marked required must be completed.</p>

      <form action="mailto:gakanksha534@gmail.com"
            method="post" enctype="text/plain">
        <div class="form-group">
          <label for="name">Full name <span>(required)</span></label>
          <input type="text" id="name" name="Name"
                 autocomplete="name" required>
        </div>

        <div class="form-group">
          <label for="email">Email address <span>(required)</span></label>
          <input type="email" id="email" name="Email"
                 autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="Subject">
        </div>

        <div class="form-group">
          <label for="message">Your message <span>(required)</span></label>
          <textarea id="message" name="Message" rows="6"
                    aria-describedby="form-help" required></textarea>
        </div>

        <button class="button" type="submit">Send Message</button>
      </form>

      <p class="contact-email">
        Or email me at
        <a href="mailto:gakanksha534@gmail.com">
          gakanksha534@gmail.com
        </a>
      </p>
    </section>
  </main>
